apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: db
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: init-permissions
          image: alpine:3.22

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE

          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data
              mkdir -p /var/run/postgresql
              find /var/lib/postgresql/data ! -user 70 -exec chown 70:70 {} +
              chown 70:70 /var/lib/postgresql/data
              chown 70:70 /var/run/postgresql
              chmod 700 /var/lib/postgresql/data
              chmod 3775 /var/run/postgresql
              echo "PostgreSQL volume permissions initialized"

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-run
              mountPath: /var/run/postgresql

      containers:
        - name: postgres
          image: postgres:16-alpine

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 5432

          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - finance
                - -d
                - finance
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - finance
                - -d
                - finance
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            - name: POSTGRES_DB
              value: finance

            - name: POSTGRES_USER
              value: finance

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-run
              mountPath: /var/run/postgresql

            - name: tmp
              mountPath: /tmp

            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/001-init.sql
              subPath: init.sql

      volumes:
        - name: postgres-run
          emptyDir: {}

        - name: tmp
          emptyDir: {}

        - name: init-sql
          configMap:
            name: postgres-init

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi
