apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pitr-restore-v2
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: postgres-pitr-restore-v2
  labels:
    app: postgres-pitr-restore-v2
spec:
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  initContainers:
    - name: prepare-restore
      image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8

      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE

      command:
        - sh
        - -c
        - |
          set -eu

          BACKUP="/var/lib/postgresql/base-backups/base-20261008-121335"

          echo "=== VERIFY BACKUP SOURCE ==="
          test -f "$BACKUP/PG_VERSION"
          test -f "$BACKUP/backup_label"
          test -f "$BACKUP/backup_manifest"

          echo "=== COPY BASE BACKUP ==="
          cp -a "$BACKUP"/. /restore-data/

          echo "=== CONFIGURE PITR ==="
          cat >> /restore-data/postgresql.auto.conf <<'EOF'

          restore_command = 'test -f /var/lib/postgresql/wal-archive/%f && cp /var/lib/postgresql/wal-archive/%f %p 2>/dev/null'
          recovery_target_name = 'pitr_before_t0'
          recovery_target_action = 'pause'
          recovery_target_timeline = '1'
          hot_standby = on
          EOF

          touch /restore-data/recovery.signal

          echo "=== SET DATABASE OWNERSHIP ==="
          chown -R 70:70 /restore-data

          echo "=== FIX POSTGRES SOCKET DIRECTORY ==="
          mkdir -p /var/run/postgresql
          chown 70:70 /var/run/postgresql
          chmod 3775 /var/run/postgresql

          echo "=== RESTORE PREPARATION COMPLETE ==="

      volumeMounts:
        - name: restore-data
          mountPath: /restore-data

        - name: base-backups
          mountPath: /var/lib/postgresql/base-backups
          readOnly: true

        - name: postgres-run
          mountPath: /var/run/postgresql

  containers:
    - name: postgres
      image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      ports:
        - containerPort: 5432

      volumeMounts:
        - name: restore-data
          mountPath: /var/lib/postgresql/data

        - name: wal-archive
          mountPath: /var/lib/postgresql/wal-archive
          readOnly: true

        - name: postgres-run
          mountPath: /var/run/postgresql

        - name: tmp
          mountPath: /tmp

  volumes:
    - name: restore-data
      persistentVolumeClaim:
        claimName: postgres-pitr-restore-v2

    - name: base-backups
      persistentVolumeClaim:
        claimName: postgres-base-backups

    - name: wal-archive
      persistentVolumeClaim:
        claimName: postgres-wal-archive

    - name: postgres-run
      emptyDir: {}

    - name: tmp
      emptyDir: {}
